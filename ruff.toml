# Lint configuration for doppel — pinned so local runs and CI agree.
line-length = 100
target-version = "py310"

[lint]
# Meaningful, stable rules. Deliberately excludes pedantic families:
# - PLW1510 (subprocess check): several calls are best-effort by design;
#   the state-changing ones already pass check=True.
# - BLE001 (blind except): the teardown paths catch broadly on purpose.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
